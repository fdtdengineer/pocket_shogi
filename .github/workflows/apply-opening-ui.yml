name: Apply opening UI changes

on:
  push:
    branches:
      - agent/add-opening-strategies
    paths:
      - tools/apply_opening_ui.py
      - .github/workflows/apply-opening-ui.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/add-opening-strategies
      - name: Apply focused changes
        run: python3 tools/apply_opening_ui.py
      - name: Validate
        run: |
          npm test
          node --check app.js
          node --check engine/cpu.js
          node --check engine/opening-book.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html README.md tests/engine.test.mjs service-worker.js
          git commit -m "Apply opening strategy UI [skip ci]"
          git push
