name: GitHub Pagesへ公開

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/pages-status.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: GitHub Pagesを設定
        id: setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 静的サイトをアップロード
        id: upload
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: GitHub Pagesへデプロイ
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 公開結果を記録
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = {
              "setup": os.environ.get("SETUP_OUTCOME") or "skipped",
              "upload": os.environ.get("UPLOAD_OUTCOME") or "skipped",
              "deployment": os.environ.get("DEPLOY_OUTCOME") or "skipped",
              "page_url": os.environ.get("PAGE_URL") or "",
              "run_id": os.environ.get("RUN_ID") or "",
              "commit_sha": os.environ.get("COMMIT_SHA") or "",
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          path = Path('.github/pages-status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-status.json
          git commit -m "Record Pages deployment status [skip ci]"
          git push

      - name: 公開失敗を通知
        if: always() && steps.deployment.outcome != 'success'
        run: exit 1
