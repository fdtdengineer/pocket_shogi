name: GitHub Pagesへ公開

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: 静的サイトをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
