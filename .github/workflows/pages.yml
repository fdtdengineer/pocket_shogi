name: GitHub Pages公開確認

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/pages-api.json
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: pages-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: GitHub Pages APIを確認
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .github
          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/pages-response.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          export HTTP_CODE
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          response_path = Path('/tmp/pages-response.json')
          try:
              response = json.loads(response_path.read_text(encoding='utf-8'))
          except Exception:
              response = {"raw": response_path.read_text(encoding='utf-8', errors='replace')}

          result = {
              "http_code": int(os.environ['HTTP_CODE']),
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "response": response,
          }
          Path('.github/pages-api.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: 確認結果を記録
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-api.json
          git commit -m "Record GitHub Pages API status [skip ci]"
          git push

      - name: 未公開なら失敗
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.github/pages-api.json').read_text(encoding='utf-8'))
          if result.get('http_code') != 200:
              raise SystemExit(1)
          PY
