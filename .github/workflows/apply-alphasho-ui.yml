name: Apply AlphaSho UI patch

on:
  push:
    branches:
      - agent/add-alphasho-browser-engine

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-alphasho-browser-engine
          fetch-depth: 0
      - name: Apply integration patch
        run: |
          git apply --check tools/alphasho-ui.patch
          git apply tools/alphasho-ui.patch
          rm tools/alphasho-ui.patch .github/workflows/apply-alphasho-ui.yml
      - name: Verify
        run: |
          npm test
          node --check app.js
          node --check service-worker.js
          for file in engine/*.js engine/alphasho/*.js tests/*.mjs; do node --check "$file"; done
          python3 -m py_compile tools/export_alphasho_onnx.py
          rm -rf tools/__pycache__
          git diff --check
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate AlphaSho into the Pocket Shogi UI"
          git push origin HEAD:agent/add-alphasho-browser-engine
